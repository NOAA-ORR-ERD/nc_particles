name: Test nc_particles with Pixi

on:
  push:
#    branches: [main]
  pull_request:
#    branches: [main]


jobs:
  test:
    strategy:
      fail-fast: false
      # Test against multiple environments (e.g., different Python versions)
      matrix:
        environment: [test312, test314]
        # do we even need these three?
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: python_implementation/pyproject.toml
          # Specify which environment from your pixi.toml to install
          environments: ${{ matrix.environment }}
          # Automatically caches the environment based on pixi.lock
          cache: true
          # cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run Tests
        working-directory: python_implimentation
        run: pixi run -e ${{ matrix.environment }} test


